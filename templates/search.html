{% extends 'base.html' %}{% block content %}
<form class="row g-2 mb-3"><div class="col-md-4"><input name="q" value="{{q}}" class="form-control" placeholder="Medicine name or generic" autocomplete="off"></div>
<div class="col-md-3"><select name="category" class="form-select"><option value="">All categories</option>{% for c in categories %}<option {{'selected' if c==cat}}>{{c}}</option>{% endfor %}</select></div>
<div class="col-md-2"><select name="sort" class="form-select"><option value="">Sort: Name</option><option value="price" {{'selected' if sort=='price'}}>Lowest price</option><option value="avail" {{'selected' if sort=='avail'}}>Most available</option></select></div>
<div class="col-auto d-flex align-items-center"><div class="form-check"><input class="form-check-input" type="checkbox" name="avail" value="1" id="av" {{'checked' if only}}><label class="form-check-label" for="av">Only available</label></div></div>
<div class="col-auto"><button class="btn btn-success">Search</button></div></form>
{% if has_loc %}<p class="text-muted small">Showing availability within {{radius}} km of <b>{{loc_label or 'your location'}}</b> · {{meds|length}} results</p>{% endif %}
{% include '_cards.html' %}{% endblock %}
