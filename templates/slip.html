<!doctype html><html><head><meta charset="utf-8"><title>Reservation {{rcode(r.id)}}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5" style="max-width:560px"><div class="card p-4 border-2 shadow-sm"><h3 class="text-center">💊 MediTrack</h3><p class="text-center text-muted">Medicine Reservation Slip</p><hr>
<h2 class="text-center">{{rcode(r.id)}}</h2><table class="table table-sm mt-3"><tr><th>Customer</th><td>{{session.name}}</td></tr><tr><th>Medicine</th><td>{{r.mname}}</td></tr><tr><th>Quantity</th><td>{{r.qty}}</td></tr>
<tr><th>Pharmacy</th><td>{{r.pname}}<br><small>{{r.address}} · {{r.phone}}</small></td></tr><tr><th>Status</th><td>{{r.status}}</td></tr><tr><th>Reserved on</th><td>{{r.created[:16]}}</td></tr></table>
<p class="small text-muted text-center">Show this code at the pharmacy to collect your medicine.</p>
<div class="text-center d-print-none"><button class="btn btn-warning" onclick="window.print()">🖨️ Print</button> <a href="/my-reservations" class="btn btn-outline-secondary">Back</a></div></div></div></body></html>
